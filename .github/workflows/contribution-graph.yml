name: Generate Contribution Graphs

on:
  schedule:
    - cron: "0 0 * * *" # Setiap hari jam 00:00 UTC
  workflow_dispatch: # Bisa trigger manual

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution graph - fmuiin (current)
        uses: Ashutosh00710/github-readme-activity-graph@v2
        with:
          username: "fmuiin"
          output_filename: "graphs/fmuiin-contribution.svg"
          theme: "github-compact"
          hide_border: true
          area: true

      - name: Generate contribution graph - fmuiin14 (legacy)
        uses: Ashutosh00710/github-readme-activity-graph@v2
        with:
          username: "fmuiin14"
          output_filename: "graphs/fmuiin14-contribution.svg"
          theme: "github-compact"
          hide_border: true
          area: true

      - name: Commit graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphs/
          git diff --staged --quiet || git commit -m "chore: update contribution graphs"
          git push
