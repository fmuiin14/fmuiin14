name: Generate Contribution Graphs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-current:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate snake graph - fmuiin (current)
        uses: Platane/snk@v3
        with:
          github_user_name: fmuiin
          outputs: |
            graphs/fmuiin-snake.svg
            graphs/fmuiin-snake-dark.svg?palette=github-dark

      - name: Generate snake graph - fmuiin14 (legacy)
        uses: Platane/snk@v3
        with:
          github_user_name: fmuiin14
          outputs: |
            graphs/fmuiin14-snake.svg
            graphs/fmuiin14-snake-dark.svg?palette=github-dark

      - name: Commit graphs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphs/
          git diff --staged --quiet || git commit -m "chore: update contribution graphs"
          git push
